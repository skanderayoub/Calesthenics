<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bar Log</title>
<meta name="theme-color" content="#0B1214">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0B1214;
  --surface:#111C1F;
  --surface2:#18262A;
  --line:#22363B;
  --line-soft:#1A2A2E;
  --ink:#E9F2F3;
  --muted:#7B959B;
  --dim:#4E656B;
  --go:#3FC9AE;
  --up:#F2A93B;
  --warn:#E5544C;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pad:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--go);outline-offset:2px;border-radius:4px}

/* ---------- micro label ---------- */
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);
}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line-soft);
  padding-top:env(safe-area-inset-top);
}
.hd{display:flex;align-items:baseline;gap:10px;padding:12px var(--pad) 10px}
.hd h1{
  margin:0;font-family:var(--mono);font-size:15px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
}
.hd .phase{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--bg);background:var(--go);padding:2px 7px;border-radius:3px;font-weight:700;
}
.hd .spacer{flex:1}
.hd .today{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}

/* rest timer rail — visible from arm's length */
#rail{height:3px;background:transparent;position:relative;overflow:hidden}
#rail .fill{height:100%;width:0;background:var(--up);transition:width .25s linear}
#restbar{
  display:none;align-items:center;gap:12px;
  padding:8px var(--pad);background:var(--surface);
  border-bottom:1px solid var(--line);
}
#restbar.on{display:flex}
#restbar .t{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#restbar .lbl{flex:1;font-size:13px;color:var(--muted)}
#restbar button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:4px}

/* ---------- layout ---------- */
main{max-width:600px;margin:0 auto;padding:0 var(--pad)}
.view{display:none;padding:18px 0 32px}
.view.on{display:block}
section{margin-bottom:26px}
h2{
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}

/* ---------- segmented session picker ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
.seg button{
  padding:11px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.seg button:disabled{opacity:.35}

/* ---------- warmup ---------- */
details.warm{border:1px solid var(--line-soft);border-radius:8px;background:var(--surface);margin-bottom:18px}
details.warm summary{
  padding:12px 14px;list-style:none;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;
}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary::after{content:"+";font-size:15px;color:var(--dim)}
details.warm[open] summary::after{content:"–"}
details.warm ol{margin:0;padding:0 16px 14px 34px;color:var(--muted);font-size:14px}
details.warm li{margin:6px 0}

/* ---------- exercise card ---------- */
.ex{
  border:1px solid var(--line-soft);border-top:2px solid var(--line);
  border-radius:8px;background:var(--surface);padding:13px 13px 11px;margin-bottom:12px;
  transition:border-color .3s;
}
.ex.ready{border-top-color:var(--up)}
.ex-hd{display:flex;align-items:baseline;gap:9px}
.ex-n{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:700;min-width:14px}
button.ex-name{
  flex:1;min-width:0;text-align:left;padding:0;font-weight:600;font-size:15.5px;
  line-height:1.25;color:var(--ink);align-self:flex-start;
}
button.ex-name .ex-label{border-bottom:1px dotted var(--dim);padding-bottom:1px}
button.ex-name:active .ex-label{color:var(--go);border-bottom-color:var(--go)}
.ex-target{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ex-skill{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--bg);background:var(--dim);
  padding:1px 5px;border-radius:2px;vertical-align:2px;margin-left:7px;
}
.ex-last{
  font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:7px 0 0;
  display:flex;gap:8px;font-variant-numeric:tabular-nums;
}
.ex-last b{color:var(--muted);font-weight:400;letter-spacing:.08em}

/* the signature: rep-range track */
.track{display:flex;gap:5px;margin:10px 0 0}
.cell{
  position:relative;flex:1;min-width:0;height:52px;border:1px solid var(--line);
  border-radius:5px;background:var(--surface2);overflow:hidden;display:block;
}
.cell .fill{
  position:absolute;left:0;right:0;bottom:0;height:0;
  background:var(--go);opacity:.17;transition:height .18s ease;
}
.cell input{
  position:relative;width:100%;height:100%;border:0;background:transparent;text-align:center;
  font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
  padding:0;outline-offset:-2px;
}
.cell input::placeholder{color:var(--dim);font-weight:400;font-size:15px}
/* A dashed box holds last session's number, waiting for one tap. */
.cell.sugg{border-style:dashed}
.cell.sugg input::placeholder{color:var(--muted);font-size:18px;font-weight:600}
.cell .accept{position:absolute;inset:0;z-index:2;background:none;border:0;padding:0}
.cell .accept:active{background:rgba(63,201,174,.12)}
.cell.full{border-color:var(--go)}
.cell.full .fill{opacity:.3}
.cell.full input{color:var(--go)}
.cell.over{border-color:var(--go)}
.cell.under input{color:var(--ink)}

.ex-foot{display:flex;align-items:center;gap:8px;margin-top:9px;min-height:32px}
.load{display:flex;align-items:center;gap:6px}
.load label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.load input{
  width:52px;padding:5px 6px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;
  font-family:var(--mono);font-size:13px;text-align:center;font-variant-numeric:tabular-nums;
}
.setctl{display:flex;gap:6px}
.setctl button{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:7px 9px;white-space:nowrap;
}
.setctl button:active{background:var(--surface2)}
.rest-btn{
  margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:7px 11px;
  font-variant-numeric:tabular-nums;
}
.rest-btn:active{background:var(--surface2)}
.ex-note{font-size:12.5px;color:var(--dim);margin:8px 0 0;line-height:1.4}
.flag{
  display:flex;gap:8px;align-items:baseline;margin-top:9px;padding:8px 10px;
  border-left:2px solid var(--up);background:rgba(242,169,59,.07);border-radius:0 4px 4px 0;
}
.flag .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--up);text-transform:uppercase;font-weight:700}
.flag .v{font-size:13px;color:var(--ink);line-height:1.35}

/* ---------- effort chips ---------- */
.effort{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.effort.hidden{display:none}
.eff-k{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-right:2px;
}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--muted);
  border:1px solid var(--line);border-radius:20px;padding:6px 11px;
}
.chip.on{border-color:currentColor;font-weight:700}
.chip.on[data-v="easy"]{color:var(--muted);background:rgba(122,145,152,.15)}
.chip.on[data-v="12"]{color:var(--go);background:rgba(63,201,174,.13)}
.chip.on[data-v="fail"]{color:var(--up);background:rgba(242,169,59,.13)}

/* ---------- consistency grid ---------- */
/* minmax(0,1fr) so the day columns can shrink below their content on a narrow
   phone instead of blowing the grid out sideways. */
.cal{
  display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;
  gap:5px 4px;align-items:center;margin-top:4px;
}
.cal>*{min-width:0}
.cal .hd{font-family:var(--mono);font-size:9px;letter-spacing:0;color:var(--dim);text-align:center}
.cal .wk{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;padding-right:5px;font-variant-numeric:tabular-nums}
.cal .n{
  font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;
  padding-left:7px;font-variant-numeric:tabular-nums;
}
.cal .n.hit{color:var(--go)}
.dot{height:20px;border-radius:4px;background:none;position:relative}
.dot.done{background:var(--go)}
.dot.miss{border:1px solid var(--line)}
.dot.rest::after{
  content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;
  margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--line);
}
.dot.future{opacity:.3}

/* ---------- banners: deload, backup ---------- */
.banner{
  display:flex;gap:12px;align-items:flex-start;
  padding:13px;border-radius:8px;margin-bottom:14px;border:1px solid var(--line);
}
.banner .b-k{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;padding-top:3px;white-space:nowrap;
}
.banner .b-m{flex:1;font-size:13px;line-height:1.45;color:var(--muted)}
.banner .b-m b{display:block;font-size:15px;color:var(--ink);margin-bottom:3px;font-weight:600}
.banner .acts{display:flex;flex-direction:column;gap:6px}
.banner .acts button{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:8px 12px;
  border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.banner.warn{border-color:rgba(242,169,59,.4);background:rgba(242,169,59,.06)}
.banner.warn .b-k{color:var(--up)}
.banner.warn .acts button:first-child{border-color:var(--up);color:var(--up)}
.banner.info{background:var(--surface)}
.banner.info .b-k{color:var(--go)}

/* ---------- session meta: sleep, bodyweight, notes ---------- */
.meta{border:1px solid var(--line-soft);border-radius:8px;background:var(--surface);padding:13px;margin-bottom:12px}
.meta .row{display:flex;gap:10px;margin-bottom:11px}
.meta .cel{flex:1;min-width:0}
.meta label{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-bottom:6px;
}
.meta input,.meta textarea{
  width:100%;padding:10px;background:var(--surface2);border:1px solid var(--line);
  border-radius:5px;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
}
.meta textarea{font-family:var(--sans);min-height:66px;resize:vertical;line-height:1.45;font-size:14px}
.meta input::placeholder,.meta textarea::placeholder{color:var(--dim)}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;padding:15px;border-radius:7px;background:var(--go);color:#06100F;
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.btn:disabled{background:var(--surface2);color:var(--dim)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:none;border:1px solid var(--warn);color:var(--warn)}
.btn+.btn{margin-top:9px}

/* ---------- gate ---------- */
.gate{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:15px}
.gate .hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.gate .hdr .name{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.gate .hdr .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crit{margin-bottom:13px}
.crit:last-child{margin-bottom:0}
.crit .row{display:flex;align-items:baseline;gap:8px;font-size:14px}
.crit .row .lab{flex:1;line-height:1.3}
.crit .row .num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.crit.done .row .num{color:var(--go)}
.crit .bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:6px;overflow:hidden}
.crit .bar i{display:block;height:100%;background:var(--muted);border-radius:2px}
.crit.done .bar i{background:var(--go)}
.gate.clear{border-color:var(--go)}

/* ---------- charts ---------- */
.chart{border:1px solid var(--line-soft);border-radius:8px;background:var(--surface);padding:14px;margin-bottom:12px}
.chart .top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.chart .top .t{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chart .top .now{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.chart .top .unit{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chart .sub{font-size:12px;color:var(--dim);margin-bottom:8px}
.chart svg{display:block;width:100%;height:78px;overflow:visible}

/* ---------- lists / tables ---------- */
.rows{border:1px solid var(--line-soft);border-radius:8px;background:var(--surface);overflow:hidden}
.rows .r{display:flex;align-items:baseline;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line-soft);font-size:14px}
.rows .r:last-child{border-bottom:0}
.rows .r .d{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:52px}
.rows .r .m{flex:1;min-width:0}
.rows .r .x{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rows .r button.del{font-family:var(--mono);font-size:11px;color:var(--dim);padding:2px 6px}

.empty{border:1px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- program view ---------- */
.ptable{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px}
.ptable caption{
  text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);padding-bottom:8px;font-weight:700;
}
.ptable th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);font-weight:400;padding:0 8px 6px 0;border-bottom:1px solid var(--line);
}
.ptable td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.ptable td:first-child{font-family:var(--mono);font-size:11px;color:var(--dim);width:16px;padding-top:11px}
.ptable td.pres{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptable .nt{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
.phase-hd{display:flex;align-items:baseline;gap:9px;margin:26px 0 4px;padding-top:16px;border-top:1px solid var(--line)}
.phase-hd h3{margin:0;font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.phase-hd .now{font-family:var(--mono);font-size:9px;letter-spacing:.12em;background:var(--go);color:var(--bg);padding:2px 6px;border-radius:2px;font-weight:700}
.phase-hd .span{font-size:12.5px;color:var(--dim);flex:1;text-align:right}
.ref{border-left:2px solid var(--line);padding:0 0 0 13px;margin:0 0 16px}
.ref h4{margin:0 0 3px;font-size:14px;font-weight:600}
.ref p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}

/* ---------- data view ---------- */
.field{display:flex;gap:8px;margin-bottom:10px}
.field input,.field select{
  flex:1;min-width:0;padding:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;font-family:var(--mono);font-size:14px;
}
.field button{padding:0 18px;border:1px solid var(--go);color:var(--go);border-radius:6px;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.hint{font-size:12.5px;color:var(--dim);margin:-4px 0 16px;line-height:1.45}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:12px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
nav button .ic{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--go)}

/* ---------- per-exercise history sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:80;background:rgba(5,9,10,.74);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-in{
  width:100%;max-width:600px;max-height:88vh;overflow-y:auto;
  background:var(--bg);border:1px solid var(--line);border-bottom:0;
  border-radius:14px 14px 0 0;
  padding:18px 16px calc(26px + env(safe-area-inset-bottom));
  animation:sheetUp .22s ease;
}
@keyframes sheetUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-hd>div:first-child{flex:1;min-width:0}
.sheet-t{font-size:19px;font-weight:600;line-height:1.22}
.sheet-s{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);margin-top:5px}
.sheet-x{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:8px 12px;white-space:nowrap;
}
.stat-row{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;min-width:0;border:1px solid var(--line-soft);border-radius:7px;background:var(--surface);padding:11px 8px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .sk{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.hs{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:6px;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1>Bar Log</h1>
    <span class="phase" id="phaseTag">—</span>
    <span class="spacer"></span>
    <span class="today" id="todayTag"></span>
  </div>
  <div id="rail"><div class="fill" id="railFill"></div></div>
  <div id="restbar">
    <span class="t" id="restT">0:00</span>
    <span class="lbl" id="restL">Rest</span>
    <button id="restSkip">Skip</button>
  </div>
</header>

<main>
  <!-- ============ TODAY ============ -->
  <div class="view on" id="v-today">
    <div class="seg" id="seg"></div>
    <div id="todayBody"></div>
  </div>

  <!-- ============ PROGRESS ============ -->
  <div class="view" id="v-progress"></div>

  <!-- ============ PROGRAM ============ -->
  <div class="view" id="v-program"></div>

  <!-- ============ DATA ============ -->
  <div class="view" id="v-data"></div>
</main>

<nav id="nav"></nav>
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   storage
   ============================================================ */
const KEY = "barlog.v1";
const DRAFT = "barlog.v1.draft";
const blank = {
  version: 1,
  sessions: [],
  weights: [],
  settings: { phase: "phase1", deloads: [], backupAck: 0, tipSeen: false }
};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(blank);
    const s = JSON.parse(raw);
    return Object.assign(structuredClone(blank), s);
  }catch(e){ return structuredClone(blank); }
}
let S = load();
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

let P = null;                 // program.json
let view = "today";
let pickedSession = null;     // session key on Today
let draft = null;             // { phase, sessionKey, date, fp, meta, entries:{} }
let persisted = false;        // browser agreed not to evict this origin

/* ============================================================
   helpers
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
/* Local dates, not UTC. A 00:30 session belongs to the day you trained,
   not to yesterday in Greenwich. */
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => iso(new Date());
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00") - new Date(a+"T00:00"))/86400000);
const short = d => d.slice(5).replace("-","/");
const mmss = s => Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2200);
}

function phase(id){ return P.phases.find(p=>p.id===(id||S.settings.phase)) || P.phases[0]; }
function phaseIndex(){ return P.phases.findIndex(p=>p.id===S.settings.phase); }
function nextPhase(){ return P.phases[phaseIndex()+1] || null; }
function sessionsOf(ph){ return Object.keys(ph.sessions); }
function suggested(){ return P.week[new Date().getDay()]; }

/* target string, e.g. "6 × 2–3" or "4 × 20–30 s" or "4 × 8–12 / side" */
function targetStr(ex, sets){
  const r = ex.min===ex.max ? String(ex.max) : ex.min+"–"+ex.max;
  return (sets||ex.sets)+" × "+r+(ex.type==="hold"?" s":"")+(ex.perSide?" /side":"");
}

/* ============================================================
   deload — program section 7
   ============================================================ */
function lastDeload(){
  const ds = (S.settings.deloads||[]).slice().sort();
  return ds.length ? ds[ds.length-1] : null;
}
function inDeloadWeek(){
  const d = lastDeload();
  return !!d && daysBetween(d, today()) < 7;
}
/* "Half the sets, same reps." */
function effSets(ex){ return inDeloadWeek() ? Math.max(1, Math.ceil(ex.sets/2)) : ex.sets; }

function firstSessionDate(){
  return S.sessions.length ? S.sessions.map(s=>s.date).sort()[0] : null;
}
function weeksSinceDeload(){
  const from = lastDeload() || firstSessionDate();
  return from ? Math.floor(daysBetween(from, today())/7) : 0;
}

/* "Whenever your numbers go backwards two sessions in a row" — total reps
   (or seconds) for a movement, at unchanged load, declining across three
   consecutive sessions. Totals rather than top set, so one bad last set
   doesn't read as a regression. */
function regressing(sessionKey, ex){
  const h = history(sessionKey, ex.id).slice(0,3);
  if(h.length < 3) return false;
  if(h[0].load !== h[1].load || h[1].load !== h[2].load) return false;
  const tot = s => s.sets.reduce((a,v)=>a+(v||0),0);
  return tot(h[0]) < tot(h[1]) && tot(h[1]) < tot(h[2]);
}
function regressions(){
  const out = [];
  sessionsOf(phase()).forEach(k=>{
    phase().sessions[k].exercises.forEach(ex=>{ if(regressing(k,ex)) out.push({k,ex}); });
  });
  return out;
}
/* One regressing exercise is a bad night's sleep. Two is a pattern. */
function deloadDue(){
  if(inDeloadWeek()) return null;
  const weeks = weeksSinceDeload(), list = regressions();
  if(list.length >= 2) return { why:"regression", weeks, list };
  if(weeks >= 8) return { why:"overdue", weeks, list };
  if(weeks >= 6) return { why:"due", weeks, list };
  return null;
}

/* ============================================================
   consistency — 4 days a week is what the program actually asks for
   ============================================================ */
function weekStart(dateStr){
  const d = new Date(dateStr+"T00:00");
  d.setDate(d.getDate() - ((d.getDay()+6) % 7));   // back to Monday
  return iso(d);
}
function weeklyTarget(){ return P.week.filter(x => x!=="rest").length; }

/* A training day is a training day — two sessions in one day still count once,
   because the target is days per week. */
function consistency(weeks){
  const done = new Set(S.sessions.map(s=>s.date));
  const now = today(), base = weekStart(now);
  const out = [];
  for(let w=0; w<weeks; w++){
    const start = new Date(base+"T00:00");
    start.setDate(start.getDate() - w*7);
    const days = [];
    for(let i=0;i<7;i++){
      const d = new Date(start);
      d.setDate(d.getDate()+i);
      const ds = iso(d);
      days.push({
        date: ds,
        logged: done.has(ds),
        planned: P.week[d.getDay()] !== "rest",
        future: ds > now
      });
    }
    out.push({ start: iso(start), days, count: days.filter(x=>x.logged).length });
  }
  return out;
}

/* ============================================================
   backup nudge — localStorage is the only copy
   ============================================================ */
function unbackedUp(){ return S.sessions.length - (S.settings.backupAck||0); }
function needsBackup(){ return unbackedUp() >= 8; }
function ackBackup(){ S.settings.backupAck = S.sessions.length; save(); }
function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "barlog-"+today()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  ackBackup();
  toast("Exported");
}

/* ============================================================
   history + the double-progression rule
   ============================================================ */
/* Prescriptions differ between Upper A and Upper B for the same movement,
   so history is scoped to the session it was performed in. */
function history(sessionKey, exId){
  return S.sessions
    .filter(s => s.sessionKey===sessionKey && s.entries[exId] && s.entries[exId].sets.length)
    .sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0)
    .map(s => ({ id:s.id, date:s.date, load:s.entries[exId].load||0,
                 rir:s.entries[exId].rir||null, sets:s.entries[exId].sets }));
}

/* How hard it felt. The program asks for 1–2 reps in reserve on most sets,
   and until now there was nowhere to record whether you complied. */
const RIR = [["easy","Easy"],["12","1–2 left"],["fail","To failure"]];
const rirLabel = v => (RIR.find(r=>r[0]===v)||[])[1] || null;

/* Every session containing a movement, across both Upper days and all phases —
   the trajectory question, as opposed to the progression rule's per-session one. */
function allHistory(exId){
  return S.sessions
    .filter(s => s.entries[exId] && s.entries[exId].sets.length)
    .sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0)
    .map(s => ({ id:s.id, date:s.date, key:s.sessionKey, deload:!!s.deload,
                 load:s.entries[exId].load||0, rir:s.entries[exId].rir||null,
                 sets:s.entries[exId].sets }));
}

/* Fires when every set hit the top of the range, at the same load,
   two sessions running. That is the rule from section 1 of the program. */
function readyToProgress(sessionKey, ex){
  const h = history(sessionKey, ex.id).slice(0,2);
  if(h.length < 2) return false;
  if(h[0].load !== h[1].load) return false;
  return h.every(s => s.sets.length >= ex.sets && s.sets.every(v => v!=null && v >= ex.max));
}

/* ============================================================
   load-normalised progress
   ============================================================ */
/* Raw rep counts stop being comparable the moment the backpack goes on, and
   Phase 2 tells you to put it on. Six bodyweight pull-ups becoming four at
   +10 kg is progress, but a rep chart draws it as a cliff. Epley e1RM over
   (bodyweight × leverage + added) keeps the curve honest. */
function findEx(exId){
  const order = [phase()].concat(P.phases.filter(p=>p.id!==phase().id));
  for(const ph of order)
    for(const k of sessionsOf(ph)){
      const e = ph.sessions[k].exercises.find(x=>x.id===exId);
      if(e) return e;
    }
  return null;
}
/* Bodyweight as of a given date — you weigh more in week 12 than week 1, and
   that extra mass is load you're moving. */
function bodyweightAt(date){
  const w = S.weights
    .filter(x => !date || x.date <= date)
    .sort((a,b)=> a.date<b.date?1:-1)[0];
  return w ? w.kg : ((P.athlete && P.athlete.startWeightKg) || 70);
}
function scorable(ex){ return !!ex && ex.type==="reps" && !!ex.loadable; }
function setScore(ex, reps, added, date){
  const bw = bodyweightAt(date) * (ex.bwFactor!=null ? ex.bwFactor : 1);
  return (bw + (added||0)) * (1 + reps/30);
}
/* Only switch the chart's metric once load is actually in play. Before that,
   reps are perfectly comparable and the plain number is easier to read. */
function everLoaded(exId){
  return S.sessions.some(s => s.entries[exId] && (s.entries[exId].load||0) > 0);
}
const topSet = sets => Math.max(...sets.filter(v=>v!=null).concat([0]));

/* Best single set for a movement across the whole log, optionally at a load. */
function best(exId, opts){
  const minLoad = opts && opts.load!=null ? opts.load : null;
  let b = 0;
  for(const s of S.sessions){
    const e = s.entries[exId];
    if(!e) continue;
    const ld = e.load||0;
    if(minLoad===0 && ld!==0) continue;
    if(minLoad>0 && ld<minLoad) continue;
    for(const v of e.sets) if(v!=null && v>b) b=v;
  }
  return b;
}

function critState(c){
  const got = best(c.ex, {load: c.load!=null?c.load:0});
  let done = got >= c.target, num = got+" / "+c.target, pct = Math.min(1, got/c.target);
  if(!done && c.alt){
    const g2 = best(c.alt.ex, {load: c.alt.load!=null?c.alt.load:0});
    if(g2 >= c.alt.target){ done=true; num = g2+" / "+c.alt.target; pct=1; }
    else if(g2/c.alt.target > pct){ num = g2+" / "+c.alt.target; pct = g2/c.alt.target; }
  }
  return { done, num, pct };
}

/* ============================================================
   rest timer
   ============================================================ */
let rest = null, raf = 0;

/* iOS will not play from an AudioContext created outside a user gesture, and
   the beep fires minutes after your last tap. So unlock one context on the
   first touch and keep it for the session. */
let actx = null;
function unlockAudio(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    if(!actx){
      actx = new C();
      const src = actx.createBufferSource();
      src.buffer = actx.createBuffer(1, 1, 22050);
      src.connect(actx.destination);
      src.start(0);
    }
    if(actx.state === "suspended") actx.resume();
  }catch(e){}
}
["pointerdown","keydown"].forEach(ev =>
  document.addEventListener(ev, unlockAudio, {passive:true}));

/* Keep the screen awake while resting, or the timer's rAF loop stops and
   you get no alert at all. */
let wake = null;
async function wakeOn(){
  try{
    if("wakeLock" in navigator && !wake){
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", ()=>{ wake = null; });
    }
  }catch(e){}
}
function wakeOff(){
  try{ if(wake){ wake.release(); wake = null; } }catch(e){}
}

function startRest(sec, label){
  if(rest) clearTimeout(rest.alarm);
  rest = { end: Date.now()+sec*1000, total: sec, label };
  /* Backstop: rAF is paused while backgrounded, a timeout usually isn't. */
  rest.alarm = setTimeout(done, sec*1000 + 60);
  $("#restbar").classList.add("on");
  $("#restL").textContent = label;
  wakeOn();
  cancelAnimationFrame(raf);
  tick();
}
function stopRest(){
  if(rest) clearTimeout(rest.alarm);
  rest = null;
  cancelAnimationFrame(raf);
  wakeOff();
  $("#restbar").classList.remove("on");
  $("#railFill").style.width = "0";
}
function tick(){
  if(!rest) return;
  const left = (rest.end - Date.now())/1000;
  if(left <= 0){ done(); return; }
  $("#restT").textContent = mmss(left);
  $("#railFill").style.width = (left/rest.total*100)+"%";
  raf = requestAnimationFrame(tick);
}
function done(){
  if(!rest) return;              // rAF and the backstop timeout can race
  clearTimeout(rest.alarm);
  rest = null;
  cancelAnimationFrame(raf);
  wakeOff();
  $("#restT").textContent = "0:00";
  $("#railFill").style.width = "0";
  beep();
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
  setTimeout(()=>{ if(!rest) $("#restbar").classList.remove("on"); }, 2500);
}
function beep(){
  try{
    unlockAudio();
    if(!actx) return;
    const t = actx.currentTime;
    [0,.22].forEach((off,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type="sine"; o.frequency.value = i ? 660 : 880;
      g.gain.setValueAtTime(.0001, t+off);
      g.gain.exponentialRampToValueAtTime(.28, t+off+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t+off+.18);
      o.connect(g).connect(actx.destination);
      o.start(t+off); o.stop(t+off+.2);
    });
  }catch(e){}
}
/* Coming back from a locked screen: resync the countdown and reclaim the lock. */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible" || !rest) return;
  wakeOn();
  cancelAnimationFrame(raf);
  tick();
});
$("#restSkip").onclick = stopRest;

/* ============================================================
   TODAY
   ============================================================ */
/* Draft entries are keyed by position in the exercise list, so a draft is only
   valid while that list is unchanged. Editing program.json — or a deload week
   halving the set counts — must invalidate it rather than silently shift your
   numbers onto the wrong movement. */
function fpIds(phaseId, sessionKey){
  const s = phase(phaseId).sessions[sessionKey];
  return s ? s.exercises.map(ex => ex.id).join("|") : null;
}
function fpSets(phaseId, sessionKey){
  const s = phase(phaseId).sessions[sessionKey];
  return s ? s.exercises.map(ex => effSets(ex)).join("|") : null;
}
/* The phase the open draft belongs to — not necessarily the current one, since
   you can reopen a session from an earlier phase to correct it. */
function draftPhase(){ return phase(draft && draft.phase); }
function editing(){ return !!(draft && draft.editId); }

function newDraft(sessionKey){
  const ph = phase();
  const d = {
    phase: ph.id, sessionKey, date: today(),
    fpIds: fpIds(ph.id, sessionKey),
    fpSets: fpSets(ph.id, sessionKey),
    meta: { sleep:"", bw:"", note:"" },
    entries: {}
  };
  ph.sessions[sessionKey].exercises.forEach((ex,i)=>{
    /* Carry the backpack forward. Leaving it at 0 when you trained at +10 kg
       last week records a load you didn't use and wrecks the comparison the
       progression rule depends on. */
    const h = ex.loadable ? history(sessionKey, ex.id) : null;
    d.entries[i] = {
      id: ex.id,
      load: h && h.length ? h[0].load : 0,
      rir: null,
      sets: new Array(effSets(ex)).fill(null)
    };
  });
  return d;
}

/* Reopen a saved session for correction. Set counts come from what was
   actually logged, not from today's prescription. */
function draftFromSession(rec){
  const ph = phase(rec.phase);
  const sess = ph.sessions[rec.sessionKey];
  if(!sess) return null;
  const w = S.weights.find(x => x.date===rec.date);
  const d = {
    phase: ph.id, sessionKey: rec.sessionKey, date: rec.date, editId: rec.id,
    fpIds: fpIds(ph.id, rec.sessionKey),
    fpSets: null,
    meta: {
      sleep: rec.sleep!=null ? String(rec.sleep) : "",
      bw: w ? String(w.kg) : "",
      note: rec.note || ""
    },
    entries: {}
  };
  sess.exercises.forEach((ex,i)=>{
    const e = rec.entries[ex.id];
    d.entries[i] = e
      ? { id: ex.id, load: e.load||0, rir: e.rir||null, sets: e.sets.slice() }
      : { id: ex.id, load: 0, rir: null, sets: new Array(ex.sets).fill(null) };
  });
  return d;
}

function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(DRAFT));
    if(!d || !d.phase || phase(d.phase).id !== d.phase) return null;
    if(!phase(d.phase).sessions[d.sessionKey]) return null;
    if(d.fpIds !== fpIds(d.phase, d.sessionKey)) return null;
    /* An unfinished edit outlives the day. A fresh draft doesn't, and it also
       has to still match today's set counts. */
    if(!d.editId){
      if(d.date !== today() || d.phase !== phase().id) return null;
      if(d.fpSets !== fpSets(d.phase, d.sessionKey)) return null;
    }
    if(!d.meta) d.meta = { sleep:"", bw:"", note:"" };
    return d;
  }catch(e){}
  return null;
}

function editSession(rec){
  const d = draftFromSession(rec);
  if(!d){ toast("That session isn't in the program any more"); return; }
  const dirty = draft && !editing() && Object.values(draft.entries).some(e=>e.sets.some(v=>v!=null));
  if(dirty && !confirm("You have unsaved sets for today. Open the older session anyway?")) return;
  draft = d;
  pickedSession = rec.sessionKey;
  saveDraft();
  renderSeg(); renderToday();
  go("today");
}
function exitEdit(){
  const sug = suggested();
  pickedSession = phase().sessions[sug] ? sug : sessionsOf(phase())[0];
  draft = newDraft(pickedSession);
  saveDraft();
  renderSeg(); renderToday();
}
function cancelEdit(){
  if(!confirm("Discard your changes to this session?")) return;
  exitEdit();
  go("progress");
}
const saveDraft = () => localStorage.setItem(DRAFT, JSON.stringify(draft));

function renderSeg(){
  const seg = $("#seg"); seg.innerHTML="";
  sessionsOf(draftPhase()).forEach(k=>{
    const b = el("button", null, P.sessionNames[k]);
    b.setAttribute("aria-pressed", String(k===pickedSession));
    b.disabled = editing();      // an edit is pinned to its own session
    b.onclick = ()=>{ pickSession(k); };
    seg.appendChild(b);
  });
}

function pickSession(k){
  if(pickedSession===k) return;
  const dirty = draft && Object.values(draft.entries).some(e=>e.sets.some(v=>v!=null));
  if(dirty && !confirm("Switch to "+P.sessionNames[k]+"? The sets you've logged today will be discarded.")) return;
  pickedSession = k;
  draft = newDraft(k); saveDraft();
  renderSeg(); renderToday();
}

function banner(kind, key, title, msg, actions){
  const b = el("div","banner "+kind);
  b.appendChild(el("span","b-k", key));
  const m = el("div","b-m");
  m.appendChild(el("b",null,title));
  m.appendChild(document.createTextNode(msg));
  b.appendChild(m);
  if(actions && actions.length){
    const a = el("div","acts");
    actions.forEach(([label,fn])=>{ const x = el("button",null,label); x.onclick = fn; a.appendChild(x); });
    b.appendChild(a);
  }
  return b;
}

function renderToday(){
  const body = $("#todayBody"); body.innerHTML="";
  const ph = draftPhase(), sess = ph.sessions[pickedSession];

  if(editing()){
    body.appendChild(banner("info","Editing",
      P.sessionNames[pickedSession]+" · "+draft.date,
      "Saving replaces that session and keeps its original date.",
      [["Cancel", cancelEdit]]));
  }else if(inDeloadWeek()){
    body.appendChild(banner("info","Deload","Deload week",
      "Half the sets, same reps — the set counts below are already halved. Keep skill practice. You'll come back stronger.",
      [["End early", ()=>{
        if(!confirm("End the deload week now and go back to full sets?")) return;
        S.settings.deloads = S.settings.deloads.filter(d=>d!==lastDeload()); save();
        draft = newDraft(pickedSession); saveDraft(); renderAll();
      }]]));
  }else{
    const due = deloadDue();
    if(due){
      const why = due.why==="regression"
        ? due.list.slice(0,2).map(r=>r.ex.name.toLowerCase()).join(" and ")+" have gone backwards three sessions running."
        : "You've trained "+due.weeks+" weeks straight.";
      body.appendChild(banner("warn","Deload", due.why==="overdue" ? "Deload overdue" : "Deload due",
        why+" Take one week at half the sets, same reps.",
        [["Start", ()=>{
          S.settings.deloads = (S.settings.deloads||[]).concat(today()); save();
          draft = newDraft(pickedSession); saveDraft(); renderAll(); toast("Deload week started");
        }]]));
    }
  }

  if(!editing() && !S.settings.tipSeen && S.sessions.length >= 1){
    body.appendChild(banner("info","Tip","One tap logs last time's number",
      "Dashed boxes show what you did in that set last session. Tap one to log it as-is, or type over it when the number differs.",
      [["Got it", ()=>{ S.settings.tipSeen = true; save(); renderToday(); }]]));
  }

  if(!editing() && needsBackup()){
    body.appendChild(banner("warn","Backup", unbackedUp()+" sessions not backed up",
      "This data lives only in this browser. Clearing site data erases it.",
      [["Export", ()=>{ exportJSON(); renderToday(); }],
       ["Later", ()=>{ ackBackup(); renderToday(); }]]));
  }

  const warm = el("details","warm");
  const sum = el("summary"); sum.appendChild(el("span",null,"Warm-up · 7 min"));
  warm.appendChild(sum);
  const ol = el("ol");
  P.warmup.forEach(w=>ol.appendChild(el("li",null,w)));
  warm.appendChild(ol);
  body.appendChild(warm);

  const h = el("h2", null, sess.name); body.appendChild(h);

  sess.exercises.forEach((ex,i)=>body.appendChild(exCard(ex,i)));

  body.appendChild(metaCard());

  const btn = el("button","btn","Save session");
  btn.id = "saveBtn";
  btn.onclick = saveSession;
  body.appendChild(btn);

  if(editing()){
    const cx = el("button","btn ghost","Cancel");
    cx.onclick = cancelEdit;
    body.appendChild(cx);
  }else{
    const clr = el("button","btn ghost","Clear today's entries");
    clr.onclick = ()=>{
      if(!confirm("Clear every number you've entered today?")) return;
      draft = newDraft(pickedSession); saveDraft(); renderToday();
    };
    body.appendChild(clr);
  }
  syncSave();
}

/* Sleep, bodyweight and notes — the rest of the log template in section 10.
   Sleep is called out in section 8 as more impactful than exercise selection,
   so it belongs next to the sets, not buried in a settings screen. */
function metaCard(){
  const c = el("div","meta");
  const row = el("div","row");

  const mk = (key, label, ph, mode) => {
    const cel = el("div","cel");
    const l = el("label", null, label); l.htmlFor = "meta-"+key;
    const i = document.createElement("input");
    i.id = "meta-"+key; i.type = "text"; i.inputMode = mode; i.placeholder = ph;
    i.value = draft.meta[key] || "";
    i.oninput = ()=>{
      const v = i.value.replace(/[^0-9.]/g,"");
      if(i.value!==v) i.value = v;
      draft.meta[key] = v; saveDraft();
    };
    cel.append(l, i);
    return cel;
  };
  row.appendChild(mk("sleep","Sleep (h)","7.5","decimal"));

  const lastW = S.weights.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
  row.appendChild(mk("bw","Bodyweight (kg)", lastW ? String(lastW.kg) : "66", "decimal"));
  c.appendChild(row);

  const l = el("label", null, "Notes"); l.htmlFor = "meta-note";
  const t = document.createElement("textarea");
  t.id = "meta-note";
  t.placeholder = "How it felt, what the park was like, anything you'd want to read next week.";
  t.value = draft.meta.note || "";
  t.oninput = ()=>{ draft.meta.note = t.value; saveDraft(); };
  c.append(l, t);
  return c;
}

function exCard(ex, i){
  const card = el("div","ex");
  const entry = draft.entries[i];
  const ready = readyToProgress(pickedSession, ex);
  if(ready) card.classList.add("ready");

  const hd = el("div","ex-hd");
  hd.appendChild(el("span","ex-n", String(i+1)));
  const nm = el("button","ex-name");
  nm.type = "button";
  nm.appendChild(el("span","ex-label", ex.name));
  if(ex.skill) nm.appendChild(el("span","ex-skill","Skill"));
  nm.setAttribute("aria-label", "History for "+ex.name);
  nm.onclick = ()=>openHistory(ex);
  hd.appendChild(nm);
  hd.appendChild(el("span","ex-target", targetStr(ex, entry.sets.length)));
  card.appendChild(hd);

  /* When editing, the session being corrected is not its own "last time". */
  const h = history(pickedSession, ex.id).filter(r => r.id !== draft.editId);
  const last = el("div","ex-last");
  if(h.length){
    last.appendChild(el("b",null,"Last"));
    last.appendChild(el("span",null,
      h[0].sets.map(v=>v==null?"–":v).join("  ") +
      (h[0].load ? "   +"+h[0].load+"kg" : "") +
      "   " + short(h[0].date)));
  }else{
    last.appendChild(el("b",null,"Last"));
    last.appendChild(el("span",null,"no record — this is your baseline"));
  }
  card.appendChild(last);

  /* Effort chips stay hidden until you've logged something, so an untouched
     card stays clean. Your program prescribes 1–2 reps in reserve on most
     sets; this is where you record whether you actually left them. */
  const effRow = el("div","effort");
  effRow.appendChild(el("span","eff-k","Effort"));
  RIR.forEach(([v,label])=>{
    const b = el("button","chip"+(entry.rir===v?" on":""), label);
    b.type = "button";
    b.dataset.v = v;
    b.setAttribute("aria-pressed", String(entry.rir===v));
    b.onclick = ()=>{
      entry.rir = entry.rir===v ? null : v;
      saveDraft();
      effRow.querySelectorAll(".chip").forEach(c=>{
        const on = c.dataset.v === entry.rir;
        c.classList.toggle("on", on);
        c.setAttribute("aria-pressed", String(on));
      });
    };
    effRow.appendChild(b);
  });
  const syncEffort = ()=>effRow.classList.toggle("hidden", !entry.sets.some(v=>v!=null));

  const track = el("div","track");
  const suggest = h.length ? h[0].sets : null;   // what you did last time
  for(let s=0;s<entry.sets.length;s++){
    const ghost = suggest && suggest[s]!=null ? suggest[s] : null;
    const cell = el("div","cell");
    const fill = el("div","fill");
    const inp = document.createElement("input");
    inp.type="text"; inp.inputMode="numeric"; inp.pattern="[0-9]*";
    inp.placeholder = ghost!=null ? String(ghost) : (ex.type==="hold" ? "s" : "–");
    inp.setAttribute("aria-label", ex.name+" set "+(s+1));
    inp.value = entry.sets[s]==null ? "" : entry.sets[s];

    const logSet = v => {
      entry.sets[s] = v;
      inp.value = v;
      cell.classList.remove("sugg");
      const a = cell.querySelector(".accept");
      if(a) a.remove();
      paint(cell, v, ex);
      saveDraft(); syncSave(); syncEffort();
      if(ex.rest) startRest(ex.rest, ex.name+" · set "+(s+1)+" logged");
    };

    inp.oninput = ()=>{
      const v = inp.value.replace(/[^0-9]/g,"").slice(0,3);
      if(inp.value!==v) inp.value=v;
      entry.sets[s] = v==="" ? null : parseInt(v,10);
      paint(cell, entry.sets[s], ex);
      saveDraft(); syncSave(); syncEffort();
    };
    /* Rest starts when you leave a set you just changed — not when you tab
       back over one you already filled. */
    let held = null;
    inp.onfocus = ()=>{ held = entry.sets[s]; inp.select(); };
    inp.onblur = ()=>{
      if(entry.sets[s]!=null && entry.sets[s]!==held && ex.rest)
        startRest(ex.rest, ex.name+" · set "+(s+1)+" logged");
      held = null;
    };
    cell.append(fill, inp);

    /* Most sets match last session, so the common case is one tap on the
       dashed box. The keyboard is for when it differs — tap again to edit. */
    if(entry.sets[s]==null && ghost!=null){
      cell.classList.add("sugg");
      const acc = el("button","accept");
      acc.type = "button";
      acc.setAttribute("aria-label", "Log "+ghost+" for "+ex.name+" set "+(s+1));
      acc.onclick = ()=>logSet(ghost);
      cell.appendChild(acc);
    }
    paint(cell, entry.sets[s], ex);
    track.appendChild(cell);
  }
  card.appendChild(track);

  const foot = el("div","ex-foot");
  if(ex.loadable){
    const wrap = el("div","load");
    const lab = el("label",null,"+kg"); lab.htmlFor = "ld"+i;
    const li = document.createElement("input");
    li.id="ld"+i; li.type="text"; li.inputMode="decimal"; li.value = entry.load||0;
    li.setAttribute("aria-label", ex.name+" added load in kilograms");
    li.oninput = ()=>{
      const v = li.value.replace(/[^0-9.]/g,"");
      if(li.value!==v) li.value=v;
      entry.load = v==="" ? 0 : parseFloat(v)||0;
      saveDraft();
    };
    wrap.append(lab, li);
    foot.appendChild(wrap);
  }

  /* Real sessions don't always match the prescription — an extra set when you
     feel good, one fewer when the bar is taken. */
  const ctl = el("div","setctl");
  const add = el("button",null,"+ Set");
  add.title = "Add a set";
  add.onclick = ()=>{ entry.sets.push(null); saveDraft(); refreshCard(i); };
  ctl.appendChild(add);
  if(entry.sets.length > 1){
    const rm = el("button",null,"− Set");
    rm.title = "Remove the last set";
    rm.onclick = ()=>{
      const v = entry.sets[entry.sets.length-1];
      if(v!=null && !confirm("Remove the last set? It has "+v+" logged.")) return;
      entry.sets.pop(); saveDraft(); refreshCard(i); syncSave();
    };
    ctl.appendChild(rm);
  }
  foot.appendChild(ctl);

  if(ex.rest){
    const rb = el("button","rest-btn","Rest "+mmss(ex.rest));
    rb.onclick = ()=>startRest(ex.rest, ex.name);
    foot.appendChild(rb);
  }
  card.appendChild(foot);
  card.appendChild(effRow);
  syncEffort();

  if(ready){
    const top2 = h.slice(0,2).map(r=>r.rir);
    let caveat = "";
    if(top2.length===2 && top2.every(x=>x==="fail"))
      caveat = " You went to failure both times to get there — your program asks for 1–2 in reserve, so hold this load one more session before adding.";
    else if(top2.length===2 && top2.every(x=>x==="easy"))
      caveat = " Both sessions felt easy, so take a bigger jump than usual.";

    const f = el("div","flag");
    f.appendChild(el("span","k","Progress"));
    f.appendChild(el("span","v",
      "You hit "+ex.max+(ex.type==="hold"?" s":"")+" on every set twice. "
      + (ex.loadable
          ? "Add weight to the backpack and drop back to "+ex.min+"."
          : "Move to the harder variation and drop back to "+ex.min+".")
      + caveat));
    card.appendChild(f);
  }
  if(ex.note) card.appendChild(el("p","ex-note", ex.note));
  return card;
}

/* Swap one card in place — re-rendering the whole view would lose your scroll
   position halfway down a session. */
function refreshCard(i){
  const cards = $("#todayBody").querySelectorAll(".ex");
  if(!cards[i]) return renderToday();
  cards[i].replaceWith(exCard(draftPhase().sessions[pickedSession].exercises[i], i));
}

function paint(cell, val, ex){
  cell.classList.remove("full","under","over");
  const fill = cell.querySelector(".fill");
  if(val==null){ fill.style.height="0"; return; }
  const span = Math.max(1, ex.max - ex.min);
  const pct = Math.max(.08, Math.min(1, (val - ex.min + 1) / (span + 1)));
  fill.style.height = (pct*100)+"%";
  if(val >= ex.max) cell.classList.add("full");
  else cell.classList.add("under");
}

function syncSave(){
  const b = $("#saveBtn"); if(!b) return;
  const n = Object.values(draft.entries).reduce((a,e)=>a+e.sets.filter(v=>v!=null).length,0);
  b.disabled = n===0;
  const sets = n+" set"+(n===1?"":"s");
  b.textContent = n===0
    ? (editing() ? "Clear every set to delete this session" : "Log a set to save")
    : (editing() ? "Save changes · "+sets : "Save session · "+sets);
}

function saveSession(){
  const entries = {};
  const ph = draftPhase(), exs = ph.sessions[pickedSession].exercises;
  Object.entries(draft.entries).forEach(([i,e])=>{
    const sets = e.sets.filter(v=>v!=null);
    if(!sets.length) return;
    entries[e.id] = { load: e.load||0, sets, name: exs[i].name, rir: e.rir || undefined };
  });
  if(!Object.keys(entries).length) return;

  const prev = editing() ? S.sessions.find(s=>s.id===draft.editId) : null;
  const rec = {
    id: editing() ? draft.editId : Date.now(),
    date: draft.date, phase: ph.id, sessionKey: pickedSession, entries,
    /* A correction keeps whatever the session was at the time. */
    deload: (prev ? prev.deload : inDeloadWeek()) || undefined,
    sleep: parseFloat(draft.meta.sleep) || undefined,
    note: (draft.meta.note||"").trim() || undefined
  };

  /* Weighing in on the session screen beats a separate trip to the Data tab. */
  const bw = parseFloat(draft.meta.bw);
  if(bw >= 30 && bw <= 200){
    S.weights = S.weights.filter(w=>w.date!==rec.date).concat({ date: rec.date, kg: bw });
  }

  if(editing()){
    const at = S.sessions.findIndex(s=>s.id===draft.editId);
    if(at >= 0) S.sessions[at] = rec; else S.sessions.push(rec);
    save();
    exitEdit();
    stopRest();
    toast("Session updated");
    go("progress");
    return;
  }

  const dup = S.sessions.findIndex(s=>s.date===rec.date && s.sessionKey===rec.sessionKey);
  if(dup >= 0){
    if(!confirm("You already saved a "+P.sessionNames[pickedSession]+" today. Replace it?")) return;
    S.sessions[dup] = rec;
  }else S.sessions.push(rec);

  save();
  draft = newDraft(pickedSession); saveDraft();
  renderToday();
  stopRest();
  toast("Session saved");

  const np = nextPhase();
  if(np && np.gate && np.gate.criteria.every(c=>critState(c).done)){
    setTimeout(()=>{
      if(confirm("You've cleared every "+np.gate.name+" criterion.\n\nMove to "+np.name+" now?")){
        S.settings.phase = np.id; save();
        pickedSession = sessionsOf(phase())[0];
        draft = newDraft(pickedSession); saveDraft();
        renderAll(); toast("Now on "+np.name);
      }
    }, 500);
  }
}

/* ============================================================
   per-exercise history sheet
   ============================================================ */
function openHistory(ex){
  const h = allHistory(ex.id);
  const top = r => Math.max(...r.sets.filter(v=>v!=null).concat([0]));
  const unit = ex.type==="hold" ? "s" : "";

  const sheet = el("div","sheet");
  const inner = el("div","sheet-in");

  const close = ()=>{ sheet.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
  sheet.onclick = e => { if(e.target===sheet) close(); };

  const hd = el("div","sheet-hd");
  const ttl = el("div");
  ttl.appendChild(el("div","sheet-t", ex.name));
  ttl.appendChild(el("div","sheet-s", targetStr(ex)+" · "+(ex.type==="hold"?"seconds":"reps")));
  hd.appendChild(ttl);
  const x = el("button","sheet-x","Close");
  x.onclick = close;
  hd.appendChild(x);
  inner.appendChild(hd);

  const scored = scorable(ex) && everLoaded(ex.id);
  const score = r => Math.round(setScore(ex, top(r), r.load, r.date));

  const stats = el("div","stat-row");
  const stat = (k,v)=>{ const d=el("div","stat"); d.appendChild(el("div","sv",v)); d.appendChild(el("div","sk",k)); return d; };
  stats.appendChild(stat("Best set", h.length ? Math.max(...h.map(top))+unit : "–"));
  stats.appendChild(scored
    ? stat("Best e1RM", Math.max(...h.map(score))+" kg")
    : stat("Sessions", String(h.length)));
  stats.appendChild(stat("Last", h.length ? short(h[0].date) : "–"));
  inner.appendChild(stats);

  if(h.length >= 2){
    const pts = h.slice().reverse().map(r => scored ? score(r) : top(r));
    inner.appendChild(chart("Top set", pts, pts[pts.length-1] + (scored ? "" : unit),
      scored ? "kg e1RM" : (ex.type==="hold" ? "now" : "reps"),
      scored
        ? "Estimated 1RM on bodyweight + backpack, oldest first"
        : "Every session, oldest first"));
  }

  if(h.length){
    const rows = el("div","rows");
    h.forEach(r=>{
      const row = el("div","r");
      row.appendChild(el("span","d", short(r.date)));
      const m = el("div","m");
      m.appendChild(el("div","hs", r.sets.map(v=>v==null?"–":v).join("  ")));
      m.appendChild(el("div","ex-note", P.sessionNames[r.key]
        + (r.deload ? " · deload" : "")
        + (r.rir ? " · "+rirLabel(r.rir).toLowerCase() : "")));
      row.appendChild(m);
      if(r.load) row.appendChild(el("span","x","+"+r.load+" kg"));
      rows.appendChild(row);
    });
    inner.appendChild(rows);
  }else{
    inner.appendChild(el("div","empty","Nothing logged for this movement yet."));
  }

  /* Dips live in both Upper days on different prescriptions, so say which
     track the progression rule is actually watching. */
  if(new Set(h.map(r=>r.key)).size > 1){
    inner.appendChild(el("p","hint",
      "This movement appears in more than one session. Progression is judged separately for each, because the prescriptions differ."));
  }

  sheet.appendChild(inner);
  document.body.appendChild(sheet);
  x.focus();
}

/* ============================================================
   PROGRESS
   ============================================================ */
function renderProgress(){
  const v = $("#v-progress"); v.innerHTML="";

  /* --- phase gate --- */
  const np = nextPhase();
  const sec1 = el("section");
  if(np && np.gate){
    sec1.appendChild(el("h2",null,"Next phase"));
    const states = np.gate.criteria.map(critState);
    const cleared = states.filter(s=>s.done).length;
    const g = el("div","gate"+(cleared===states.length?" clear":""));
    const hdr = el("div","hdr");
    hdr.appendChild(el("span","name", np.gate.name));
    hdr.appendChild(el("span","cnt", cleared+" / "+states.length));
    g.appendChild(hdr);
    np.gate.criteria.forEach((c,i)=>{
      const st = states[i];
      const d = el("div","crit"+(st.done?" done":""));
      const row = el("div","row");
      row.appendChild(el("span","lab", c.label));
      row.appendChild(el("span","num", st.done ? "✓ "+st.num : st.num));
      d.appendChild(row);
      const bar = el("div","bar"); const j = el("i"); j.style.width=(st.pct*100)+"%";
      bar.appendChild(j); d.appendChild(bar);
      g.appendChild(d);
    });
    sec1.appendChild(g);
    if(cleared===states.length){
      const b = el("button","btn","Advance to "+np.name);
      b.style.marginTop="10px";
      b.onclick = ()=>{
        S.settings.phase = np.id; save();
        pickedSession = sessionsOf(phase())[0];
        draft = newDraft(pickedSession); saveDraft();
        renderAll(); toast("Now on "+np.name);
      };
      sec1.appendChild(b);
    }else{
      sec1.appendChild(el("p","hint","Numbers come from your best single set in the log. Never advance by calendar."));
    }
  }else{
    sec1.appendChild(el("h2",null,"Phase"));
    sec1.appendChild(el("div","empty","You're on the last phase in the program. Keep loading the backpack."));
  }
  v.appendChild(sec1);

  /* --- consistency --- */
  const secC = el("section");
  secC.appendChild(el("h2",null,"Consistency"));
  if(S.sessions.length){
    const target = weeklyTarget();
    const span = Math.min(10, Math.floor(daysBetween(weekStart(firstSessionDate()), weekStart(today()))/7) + 1);
    const wks = consistency(span);
    const card = el("div","gate");
    const hdr = el("div","hdr");
    hdr.appendChild(el("span","name","This week"));
    hdr.appendChild(el("span","cnt", wks[0].count+" / "+target));
    card.appendChild(hdr);

    const cal = el("div","cal");
    cal.appendChild(el("div","wk"));
    ["M","T","W","T","F","S","S"].forEach(d=>cal.appendChild(el("div","hd",d)));
    cal.appendChild(el("div","n"));
    wks.forEach(w=>{
      cal.appendChild(el("div","wk", short(w.start)));
      w.days.forEach(d=>{
        let cls = "dot";
        if(d.logged) cls += " done";
        else if(d.future) cls += (d.planned ? " miss future" : " rest future");
        else if(d.planned) cls += " miss";
        else cls += " rest";
        const cell = el("div", cls);
        cell.title = d.date + (d.logged ? " · trained" : d.planned ? " · missed" : " · rest day");
        cal.appendChild(cell);
      });
      cal.appendChild(el("div","n"+(w.count>=target?" hit":""), String(w.count)));
    });
    card.appendChild(cal);

    const complete = wks.slice(1);
    const hits = complete.filter(w=>w.count>=target).length;
    card.appendChild(el("p","ex-note", complete.length
      ? "Hit the "+target+"-day target in "+hits+" of the last "+complete.length+" complete week"+(complete.length>1?"s":"")+"."
      : "First week in. The program asks for "+target+" days."));
    secC.appendChild(card);
  }else{
    secC.appendChild(el("div","empty","Nothing logged yet. The program asks for "+weeklyTarget()+" days a week — this grid will show whether you're getting them."));
  }
  v.appendChild(secC);

  /* --- deload --- */
  const inW = inDeloadWeek(), due = deloadDue(), regs = regressions();
  const secD = el("section");
  secD.appendChild(el("h2",null,"Deload"));
  const dl = el("div","gate"+(inW?" clear":""));
  const dhdr = el("div","hdr");
  dhdr.appendChild(el("span","name", inW ? "Deload week" : due ? "Due now" : "Training block"));
  dhdr.appendChild(el("span","cnt", inW
    ? Math.max(0, 7 - daysBetween(lastDeload(), today()))+" days left"
    : weeksSinceDeload()+" weeks"));
  dl.appendChild(dhdr);

  if(inW){
    dl.appendChild(el("p","ex-note","Half the sets, same reps — Today already shows the reduced counts. Keep skill practice. This is a feature, not lost time."));
  }else{
    dl.appendChild(el("p","ex-note", due
      ? (due.why==="regression"
          ? "Your numbers are going backwards. That's the signal to deload, not the calendar."
          : "Six to eight weeks is the window, and you're at "+due.weeks+".")
      : "Take one every 6–8 weeks, or as soon as your numbers go backwards two sessions running."));

    /* Section 9: burning out mid-session is usually effort or rest, not fitness. */
    const recent = S.sessions.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
    const toFailure = recent ? Object.values(recent.entries).filter(e=>e.rir==="fail").length : 0;
    if(toFailure >= 3){
      dl.appendChild(el("p","ex-note",
        "Last session you went to failure on "+toFailure+" exercises. Your program asks for 1–2 reps in reserve on most sets — that alone will bury recovery on 4 days a week."));
    }

    if(regs.length){
      const rows = el("div","rows");
      rows.style.marginTop = "11px";
      regs.forEach(r=>{
        const row = el("div","r");
        row.appendChild(el("span","d", P.sessionNames[r.k]));
        row.appendChild(el("div","m", r.ex.name));
        row.appendChild(el("span","x","going backwards"));
        rows.appendChild(row);
      });
      dl.appendChild(rows);
    }
    const b = el("button","btn"+(due?"":" ghost"),"Start a deload week");
    b.style.marginTop = "12px";
    b.onclick = ()=>{
      S.settings.deloads = (S.settings.deloads||[]).concat(today()); save();
      draft = newDraft(pickedSession); saveDraft();
      renderAll(); toast("Deload week started");
    };
    dl.appendChild(b);
  }
  secD.appendChild(dl);
  v.appendChild(secD);

  /* --- ready to progress --- */
  const flags = [];
  sessionsOf(phase()).forEach(k=>{
    phase().sessions[k].exercises.forEach(ex=>{
      if(readyToProgress(k, ex)) flags.push({k, ex});
    });
  });
  const sec2 = el("section");
  sec2.appendChild(el("h2",null,"Ready to progress"));
  if(flags.length){
    const rows = el("div","rows");
    flags.forEach(f=>{
      const r = el("div","r");
      r.appendChild(el("span","d", P.sessionNames[f.k]));
      const m = el("div","m");
      m.appendChild(el("div",null,f.ex.name));
      m.appendChild(el("div","ex-note", f.ex.loadable ? "Add backpack weight, drop back to "+f.ex.min : "Move to the harder variation"));
      r.appendChild(m);
      r.appendChild(el("span","x", targetStr(f.ex)));
      rows.appendChild(r);
    });
    sec2.appendChild(rows);
  }else{
    sec2.appendChild(el("div","empty","Nothing yet. An exercise lands here after you hit the top of its rep range on every set, two sessions in a row."));
  }
  v.appendChild(sec2);

  /* --- bodyweight --- */
  const sec3 = el("section");
  sec3.appendChild(el("h2",null,"Bodyweight"));
  const w = S.weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(w.length >= 2){
    const first = w[0], lastW = w[w.length-1];
    const days = (new Date(lastW.date) - new Date(first.date)) / 86400000;
    const perMonth = days > 6 ? ((lastW.kg-first.kg)/days*30) : null;
    let verdict = "Log at least a week to see a monthly rate.";
    if(perMonth != null){
      const r = perMonth.toFixed(2);
      if(perMonth < .1) verdict = r+" kg/month — under target. Eat more.";
      else if(perMonth > .35) verdict = r+" kg/month — over target. Most of that isn't muscle.";
      else verdict = r+" kg/month — on target (0.2–0.3).";
    }
    sec3.appendChild(chart("Bodyweight", w.map(x=>x.kg), lastW.kg.toFixed(1), "kg", verdict));
  }else{
    sec3.appendChild(el("div","empty","Weigh yourself weekly. The scale is how you know whether the food is working — log it with your session, or under Data."));
  }
  const slept = S.sessions.filter(s=>s.sleep).sort((a,b)=>a.date<b.date?1:-1).slice(0,7);
  if(slept.length){
    const avg = slept.reduce((a,s)=>a+s.sleep,0)/slept.length;
    sec3.appendChild(el("p","hint",
      "Sleep, last "+slept.length+" session"+(slept.length>1?"s":"")+": "+avg.toFixed(1)+" h average"+
      (avg < 7 ? " — under the 7–9 h the program asks for, and it costs you more than any exercise choice." : ".")));
  }
  v.appendChild(sec3);

  /* --- key lifts --- */
  const sec4 = el("section");
  sec4.appendChild(el("h2",null,"Top set"));
  let any = false;
  [["pullups","Pull-ups"],["dips","Dips"]].forEach(([id,label])=>{
    const sess = S.sessions.filter(s=>s.entries[id]).sort((a,b)=>a.date<b.date?-1:1);
    if(sess.length < 2) return;
    const ex = findEx(id);
    const scored = scorable(ex) && everLoaded(id);
    const pts = sess.map(s => scored
      ? Math.round(setScore(ex, topSet(s.entries[id].sets), s.entries[id].load, s.date))
      : topSet(s.entries[id].sets));
    any = true;
    sec4.appendChild(chart(label, pts, String(pts[pts.length-1]),
      scored ? "kg e1RM" : "best",
      scored
        ? "Estimated 1RM on bodyweight + backpack, so adding load reads as progress"
        : sess.length+" sessions logged · best set"));
  });
  if(!any) sec4.appendChild(el("div","empty","Charts appear once you've logged pull-ups or dips twice."));
  v.appendChild(sec4);

  /* --- log --- */
  const sec5 = el("section");
  sec5.appendChild(el("h2",null,"Recent sessions"));
  const recent = S.sessions.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
  if(recent.length){
    const rows = el("div","rows");
    recent.forEach(s=>{
      const r = el("div","r");
      r.appendChild(el("span","d", short(s.date)));
      const m = el("div","m");
      m.appendChild(el("div",null, P.sessionNames[s.sessionKey] + (s.deload ? " · deload" : "")));
      const top = Object.values(s.entries).slice(0,3)
        .map(e=>e.name.split(",")[0]+" "+e.sets.join("/")).join(" · ");
      m.appendChild(el("div","ex-note", top));
      if(s.sleep) m.appendChild(el("div","ex-note", s.sleep+" h sleep"));
      if(s.note) m.appendChild(el("div","ex-note", "“"+s.note+"”"));
      r.appendChild(m);
      const ed = el("button","del","Edit");
      ed.setAttribute("aria-label","Edit session from "+s.date);
      ed.onclick = ()=>editSession(s);
      r.appendChild(ed);
      const del = el("button","del","Delete");
      del.setAttribute("aria-label","Delete session from "+s.date);
      del.onclick = ()=>{
        if(!confirm("Delete the "+P.sessionNames[s.sessionKey]+" from "+s.date+"?")) return;
        S.sessions = S.sessions.filter(x=>x.id!==s.id); save(); renderAll(); toast("Session deleted");
      };
      r.appendChild(del);
      rows.appendChild(r);
    });
    sec5.appendChild(rows);
  }else{
    const e = el("div","empty");
    e.appendChild(el("b",null,"No sessions yet"));
    e.appendChild(document.createTextNode("Open Today, pick a session, and log your first set."));
    sec5.appendChild(e);
  }
  v.appendChild(sec5);
}

function chart(title, vals, now, unit, sub){
  const c = el("div","chart");
  const top = el("div","top");
  top.appendChild(el("span","t", title));
  top.appendChild(el("span","now", now));
  top.appendChild(el("span","unit", unit));
  c.appendChild(top);
  if(sub) c.appendChild(el("div","sub", sub));

  const W=300, H=78, pad=4;
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=> vals.length===1 ? W/2 : (i/(vals.length-1))*(W-pad*2)+pad;
  const y=v=> H-pad - ((v-min)/span)*(H-pad*2);
  const line = vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area = line+" L "+x(vals.length-1).toFixed(1)+" "+H+" L "+x(0).toFixed(1)+" "+H+" Z";
  const lx = x(vals.length-1).toFixed(1), ly = y(vals[vals.length-1]).toFixed(1);

  c.insertAdjacentHTML("beforeend",
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(title)+' over time">'+
      '<defs><linearGradient id="g'+title.replace(/\W/g,"")+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#3FC9AE" stop-opacity=".22"/>'+
        '<stop offset="1" stop-color="#3FC9AE" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#g'+title.replace(/\W/g,"")+')"/>'+
      '<path d="'+line+'" fill="none" stroke="#3FC9AE" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
      '<circle cx="'+lx+'" cy="'+ly+'" r="3" fill="#3FC9AE"/>'+
    '</svg>');
  return c;
}

/* ============================================================
   PROGRAM
   ============================================================ */
function renderProgram(){
  const v = $("#v-program"); v.innerHTML="";

  const sec = el("section");
  sec.appendChild(el("h2",null,"Week"));
  const rows = el("div","rows");
  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  [1,2,3,4,5,6,0].forEach(d=>{
    const r = el("div","r");
    r.appendChild(el("span","d", dayNames[d]));
    r.appendChild(el("div","m", P.sessionNames[P.week[d]]));
    if(d === new Date().getDay()) r.appendChild(el("span","x","today"));
    rows.appendChild(r);
  });
  sec.appendChild(rows);
  sec.appendChild(el("p","hint","Skill work goes first, right after the warm-up, when you're fresh. Rest 2–3 min on the hard compound work."));
  v.appendChild(sec);

  P.phases.forEach(ph=>{
    const hd = el("div","phase-hd");
    hd.appendChild(el("h3",null,ph.name));
    if(ph.id===S.settings.phase) hd.appendChild(el("span","now","Current"));
    hd.appendChild(el("span","span", ph.span));
    v.appendChild(hd);

    if(ph.gate){
      const p = el("p","hint");
      p.style.marginTop="10px";
      p.textContent = "Entry: " + ph.gate.criteria.map(c=>c.label).join(" · ");
      v.appendChild(p);
    }

    sessionsOf(ph).forEach(k=>{
      const t = el("table","ptable");
      const cap = el("caption", null, ph.sessions[k].name); t.appendChild(cap);
      const thead = document.createElement("thead");
      thead.innerHTML = "<tr><th></th><th>Exercise</th><th style='text-align:right'>Sets × reps</th></tr>";
      t.appendChild(thead);
      const tb = document.createElement("tbody");
      ph.sessions[k].exercises.forEach((ex,i)=>{
        const tr = document.createElement("tr");
        tr.appendChild(el("td",null,String(i+1)));
        const td = el("td");
        td.appendChild(document.createTextNode(ex.name));
        if(ex.note) td.appendChild(el("span","nt", ex.note));
        tr.appendChild(td);
        tr.appendChild(el("td","pres", targetStr(ex)));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      v.appendChild(t);
    });
  });

  const rsec = el("section");
  rsec.style.marginTop = "26px";
  rsec.style.paddingTop = "18px";
  rsec.style.borderTop = "1px solid var(--line)";
  rsec.appendChild(el("h2",null,"Rules that matter"));
  P.reference.forEach(r=>{
    const d = el("div","ref");
    d.appendChild(el("h4",null,r.heading));
    d.appendChild(el("p",null,r.body));
    rsec.appendChild(d);
  });
  v.appendChild(rsec);
}

/* ============================================================
   DATA
   ============================================================ */
function renderData(){
  const v = $("#v-data"); v.innerHTML="";

  /* bodyweight */
  const s1 = el("section");
  s1.appendChild(el("h2",null,"Log bodyweight"));
  const f = el("div","field");
  const di = document.createElement("input"); di.type="date"; di.value=today();
  const ki = document.createElement("input"); ki.type="text"; ki.inputMode="decimal"; ki.placeholder="kg";
  ki.setAttribute("aria-label","Bodyweight in kilograms");
  const bt = el("button",null,"Add");
  bt.onclick = ()=>{
    const kg = parseFloat(ki.value);
    if(!kg || kg<30 || kg>200){ toast("Enter a weight in kg"); return; }
    S.weights = S.weights.filter(w=>w.date!==di.value);
    S.weights.push({date: di.value, kg});
    save(); ki.value=""; renderData(); toast("Weight logged");
  };
  f.append(di, ki, bt); s1.appendChild(f);
  s1.appendChild(el("p","hint","Weigh in weekly, same conditions. Target 0.2–0.3 kg gained per month — slow gain means most of it is muscle."));
  if(S.weights.length){
    const rows = el("div","rows");
    S.weights.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,10).forEach(w=>{
      const r = el("div","r");
      r.appendChild(el("span","d", short(w.date)));
      r.appendChild(el("div","m", w.kg.toFixed(1)+" kg"));
      const del = el("button","del","Delete");
      del.onclick = ()=>{ S.weights = S.weights.filter(x=>x.date!==w.date); save(); renderAll(); };
      r.appendChild(del);
      rows.appendChild(r);
    });
    s1.appendChild(rows);
  }
  v.appendChild(s1);

  /* phase */
  const s2 = el("section");
  s2.appendChild(el("h2",null,"Current phase"));
  const f2 = el("div","field");
  const sel = document.createElement("select");
  sel.setAttribute("aria-label","Current phase");
  P.phases.forEach(p=>{
    const o = document.createElement("option"); o.value=p.id; o.textContent=p.name;
    if(p.id===S.settings.phase) o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange = ()=>{
    S.settings.phase = sel.value; save();
    pickedSession = sessionsOf(phase())[0];
    draft = newDraft(pickedSession); saveDraft();
    renderAll(); toast("Switched to "+phase().name);
  };
  f2.appendChild(sel); s2.appendChild(f2);
  s2.appendChild(el("p","hint","Set this by hand only if you need to go back. The app offers to advance you when you clear a gate."));
  v.appendChild(s2);

  /* deload weeks */
  const sD = el("section");
  sD.appendChild(el("h2",null,"Deload weeks"));
  const dls = (S.settings.deloads||[]).slice().sort((a,b)=>a<b?1:-1);
  if(dls.length){
    const rows = el("div","rows");
    dls.forEach(d=>{
      const r = el("div","r");
      r.appendChild(el("span","d", short(d)));
      r.appendChild(el("div","m", daysBetween(d, today()) < 7 ? "In progress" : "Week of "+d));
      const del = el("button","del","Delete");
      del.onclick = ()=>{
        S.settings.deloads = S.settings.deloads.filter(x=>x!==d); save();
        draft = newDraft(pickedSession); saveDraft(); renderAll();
      };
      r.appendChild(del);
      rows.appendChild(r);
    });
    sD.appendChild(rows);
  }else{
    sD.appendChild(el("p","hint","None yet. Start one from Progress when you're due, or when your numbers go backwards twice."));
  }
  v.appendChild(sD);

  /* backup */
  const s3 = el("section");
  s3.appendChild(el("h2",null,"Backup"));
  const stat = el("p","hint");
  stat.textContent = S.sessions.length+" sessions · "+S.weights.length+" weigh-ins · "
    + (unbackedUp() > 0 ? unbackedUp()+" not yet exported · " : "")
    + (persisted ? "storage marked persistent" : "stored in this browser only");
  s3.appendChild(stat);

  const ex = el("button","btn ghost","Export JSON");
  ex.onclick = ()=>{ exportJSON(); renderData(); };
  s3.appendChild(ex);

  const imp = el("button","btn ghost","Import JSON");
  imp.onclick = ()=>{
    const fi = document.createElement("input");
    fi.type="file"; fi.accept="application/json,.json";
    fi.onchange = ()=>{
      const file = fi.files[0]; if(!file) return;
      const rd = new FileReader();
      rd.onload = ()=>{
        try{
          const d = JSON.parse(rd.result);
          if(!Array.isArray(d.sessions)) throw new Error("bad");
          if(!confirm("Replace all local data with this file? "+d.sessions.length+" sessions.")) return;
          S = Object.assign(structuredClone(blank), d);
          save();
          pickedSession = sessionsOf(phase())[0];
          draft = newDraft(pickedSession); saveDraft();
          renderAll(); toast("Imported");
        }catch(e){ toast("That file isn't a Bar Log export"); }
      };
      rd.readAsText(file);
    };
    fi.click();
  };
  s3.appendChild(imp);

  const wipe = el("button","btn danger","Erase everything");
  wipe.onclick = ()=>{
    if(!confirm("Erase all sessions and weigh-ins? Export first if you want a copy.")) return;
    if(!confirm("Last check — this cannot be undone.")) return;
    S = structuredClone(blank); save();
    localStorage.removeItem(DRAFT);
    pickedSession = sessionsOf(phase())[0];
    draft = newDraft(pickedSession);
    renderAll(); toast("Erased");
  };
  s3.appendChild(wipe);
  v.appendChild(s3);
}

/* ============================================================
   nav + boot
   ============================================================ */
const TABS = [
  ["today","Today",'<path d="M4 5h16M4 12h16M4 19h10"/>'],
  ["progress","Progress",'<path d="M4 19V5M4 19h16"/><path d="M8 15l4-5 3 3 4-6"/>'],
  ["program","Program",'<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h7M9 14h7"/>'],
  ["data","Data",'<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/>']
];
function renderNav(){
  const n = $("#nav"); n.innerHTML="";
  TABS.forEach(([id,label,ic])=>{
    const b = el("button");
    b.innerHTML = '<svg class="ic" viewBox="0 0 24 24">'+ic+'</svg>';
    b.appendChild(el("span",null,label));
    if(id===view) b.setAttribute("aria-current","page");
    b.onclick = ()=>go(id);
    n.appendChild(b);
  });
}
function go(id){
  view = id;
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  $("#v-"+id).classList.add("on");
  renderNav();
  if(id==="progress") renderProgress();
  if(id==="program") renderProgram();
  if(id==="data") renderData();
  window.scrollTo(0,0);
}
function renderAll(){
  $("#phaseTag").textContent = phase().name.replace("Phase ","P");
  const sug = suggested();
  $("#todayTag").textContent = sug==="rest" ? "Rest day" : P.sessionNames[sug];
  renderSeg(); renderToday();
  if(view==="progress") renderProgress();
  if(view==="program") renderProgram();
  if(view==="data") renderData();
  renderNav();
}

fetch("program.json", {cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(p=>{
    P = p;
    if(!phase(S.settings.phase)) S.settings.phase = P.phases[0].id;
    draft = loadDraft();
    if(draft){
      pickedSession = draft.sessionKey;
    }else{
      const sug = suggested();
      pickedSession = phase().sessions[sug] ? sug : sessionsOf(phase())[0];
      draft = newDraft(pickedSession);
      saveDraft();
    }
    renderAll();
  })
  .catch(err=>{
    document.querySelector("main").innerHTML =
      '<div class="view on"><div class="empty"><b>Can\'t read program.json</b>'+
      'Bar Log needs to be served over http, not opened as a file. Use the GitHub Pages URL, '+
      'or run <code>python3 -m http.server</code> in this folder.</div></div>';
    console.error(err);
  });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* Ask the browser not to evict this origin under storage pressure. Granted
   without a prompt for installed PWAs on most platforms; a no-op elsewhere.
   The export nudge is the real backstop. */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted()
    .then(p => p || navigator.storage.persist())
    .then(p => { persisted = !!p; })
    .catch(()=>{});
}
